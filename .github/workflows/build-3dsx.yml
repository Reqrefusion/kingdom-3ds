name: Build 3DSX
# Preserve the exact source ref and manual release input for a Windows handoff.
run-name: ${{ format('3DSX [{0},{1}]', toJSON(github.ref), toJSON(inputs.release_tag || '')) }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release name (empty = latest prerelease)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-3dsx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # atomic per-run claim tag; checkout does not persist credentials
    outputs:
      proceed: ${{ steps.claim.outputs.proceed }}
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the conversion tools (ffmpeg for the music, Pillow for the images)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3-pil ca-certificates
      - name: Claim Linux build
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/runner_handoff.py linux
      - name: Make sure the 3DS libraries are present
        if: steps.claim.outputs.proceed == 'true'
        run: dkp-pacman -S --noconfirm --needed 3ds-citro2d 3ds-citro3d libctru || true
      - name: Check Python syntax and the parity boundary
        if: steps.claim.outputs.proceed == 'true'
        run: |
          python3 -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for folder in ['tools','tests'] for p in pathlib.Path(folder).rglob('*.py')]"
          python3 tools/check_parity_boundary.py
      - name: Build kingdom.3dsx (the original assets are downloaded, verified, converted and embedded)
        if: steps.claim.outputs.proceed == 'true'
        run: python3 tools/build_release.py --sdk /opt/devkitpro
      - name: Upload the application
        if: steps.claim.outputs.proceed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kingdom.3dsx
          path: release/kingdom.3dsx
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: needs.build.outputs.proceed == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-kingdom-release
      cancel-in-progress: false
    steps:
      - name: Download the application
        uses: actions/download-artifact@v8
        with:
          name: kingdom.3dsx
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          RELEASE_TITLE="$(printf '%s' "${RELEASE_NAME:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          RELEASE_TITLE="${RELEASE_TITLE:-latest}"
          RELEASE_TAG="$(printf '%s' "$RELEASE_TITLE" | tr '[:space:]' '-')"
          if [[ "${RELEASE_TAG,,}" == latest ]]; then
            RELEASE_TAG=latest
            RELEASE_TITLE=latest
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test -s release/kingdom.3dsx
          NOTES='Copy kingdom.3dsx to SD:/3ds/. The images, music and sounds of the original open-source Kingdom are inside the file. Non-commercial use only: see LICENSE.'
          if [[ "$RELEASE_TAG" == latest ]]; then
            if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload latest release/kingdom.3dsx --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes "$NOTES" --prerelease --latest=false
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f "sha=$GITHUB_SHA" -F force=true
            else
              gh release create latest release/kingdom.3dsx --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title latest --notes "$NOTES" --prerelease --latest=false
            fi
          else
            gh release create --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$NOTES" --latest -- "$RELEASE_TAG" release/kingdom.3dsx
          fi
